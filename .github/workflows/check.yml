name: Backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: horaahora_test
          POSTGRES_USER: horaahora
          POSTGRES_PASSWORD: horaahora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horaahora -d horaahora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://horaahora:horaahora@localhost:5432/horaahora_test
      TEST_DATABASE_URL: postgresql+psycopg://horaahora:horaahora@localhost:5432/horaahora_test
      RATE_LIMIT_HASH_SECRET: ci-rate-limit-secret

    steps:
      - uses: actions/checkout@v4

      - name: Lint Python
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.0"
          args: "check"
          src: "."

      - name: Check Python formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.0"
          args: "format --check"
          src: "."

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-python: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: PYTHONPATH=. uv run --frozen --no-sync python -m pytest -q

      - name: Check migrations match the models
        run: |
          uv run --frozen --no-sync alembic upgrade head
          uv run --frozen --no-sync alembic check
