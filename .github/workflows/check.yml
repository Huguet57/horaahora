name: Backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: horaahora_test
          POSTGRES_USER: horaahora
          POSTGRES_PASSWORD: horaahora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horaahora -d horaahora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://horaahora:horaahora@localhost:5432/horaahora_test
      TEST_DATABASE_URL: postgresql+psycopg://horaahora:horaahora@localhost:5432/horaahora_test
      RATE_LIMIT_HASH_SECRET: ci-rate-limit-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q
