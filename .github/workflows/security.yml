name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Scan dependencies and repository configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          format: "table"
