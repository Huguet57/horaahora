name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The Firebase configuration stays out of the public repository. Without
      # the secret (for example on pull requests from forks) the app still
      # builds, with news notifications unavailable.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase configured: the app is built with news notifications."
          else
            echo "No GOOGLE_SERVICES_JSON secret: the app is built without news notifications."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug and release apps
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: castells-en-vena-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
