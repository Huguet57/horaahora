name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "Makefile"
      - "Version.xcconfig"
      - ".github/workflows/android.yml"
  push:
    paths:
      - "android/**"
      - "Makefile"
      - "Version.xcconfig"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The steps share one Gradle daemon, which setup-gradle stops at the end of the job.
      - name: Unit tests
        run: ./gradlew test

      - name: Build and lint the app
        working-directory: .
        run: make android-build android-lint

      - name: Upload the debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: la-calculadora-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
