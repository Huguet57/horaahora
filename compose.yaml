services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://horaahora:horaahora@db:5432/horaahora
      RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET:-local-development-secret}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_MODEL: ${AI_MODEL:?AI_MODEL is required}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required}
      AI_BASE_URL: ${AI_BASE_URL:-}
      HOUR_BY_HOUR_SOURCE_ENABLED: ${HOUR_BY_HOUR_SOURCE_ENABLED:-true}
      AGENDA_SOURCE: ${AGENDA_SOURCE:-disabled}
      AGENDA_REFRESH_SECONDS: ${AGENDA_REFRESH_SECONDS:-1800}
      AGENDA_REFRESH_ON_REQUEST: ${AGENDA_REFRESH_ON_REQUEST:-false}
      CCCC_AGENDA_URL: ${CCCC_AGENDA_URL:-https://castellscat.cat/public/ca/agenda}
      CCCC_AGENDA_FIXTURE_PATH: ${CCCC_AGENDA_FIXTURE_PATH:-backend/data/cccc_agenda_fixture.html}
      CCCC_AGENDA_AUTHORIZED: ${CCCC_AGENDA_AUTHORIZED:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  agenda-sync:
    build: .
    command: ["python", "-m", "backend.jobs.sync_agenda", "--daemon"]
    profiles: ["ingestion"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://horaahora:horaahora@db:5432/horaahora
      RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET:-local-development-secret}
      AGENDA_SOURCE: ${AGENDA_SOURCE:-disabled}
      AGENDA_SYNC_INTERVAL_SECONDS: ${AGENDA_SYNC_INTERVAL_SECONDS:-86400}
      AGENDA_SYNC_MONTHS_BACK: ${AGENDA_SYNC_MONTHS_BACK:-1}
      AGENDA_SYNC_MONTHS_AHEAD: ${AGENDA_SYNC_MONTHS_AHEAD:-12}
      CCCC_AGENDA_URL: ${CCCC_AGENDA_URL:-https://castellscat.cat/public/ca/agenda}
      CCCC_AGENDA_FIXTURE_PATH: ${CCCC_AGENDA_FIXTURE_PATH:-backend/data/cccc_agenda_fixture.html}
      CCCC_AGENDA_AUTHORIZED: ${CCCC_AGENDA_AUTHORIZED:-false}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: horaahora
      POSTGRES_USER: horaahora
      POSTGRES_PASSWORD: horaahora
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horaahora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
