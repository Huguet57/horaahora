services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://horaahora:horaahora@db:5432/horaahora
      RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET:-local-development-secret}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_MODEL: ${AI_MODEL:?AI_MODEL is required}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required}
      AI_BASE_URL: ${AI_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    # Only this computer can reach it; alembic and uvicorn run from the host.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: horaahora
      POSTGRES_USER: horaahora
      POSTGRES_PASSWORD: horaahora
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horaahora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
