openapi: 3.1.0
info:
  title: API de La calculadora de l'Aleta
  version: 1.0.0
  description: Contracte públic neutral respecte del proveïdor d'IA, la base de dades i l'allotjament.
servers:
  - url: https://api.example.cat
  - url: http://127.0.0.1:8000
paths:
  /v1/chat:
    post:
      operationId: calculateCastells
      summary: Interpreta una consulta, calcula puntuacions o respon sobre el Concurs
      description: Els càlculs són deterministes, el coneixement del Concurs prové d'instantànies versionades i la resposta no identifica cap model o proveïdor. El servidor només desa la consulta i la resposta, sense identificador d'instal·lació ni IP i durant 90 dies, quan `share_for_improvement` és cert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Resultat factual i estructurat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '400':
          description: Consulta invàlida
        '429':
          description: Límit de consultes superat
components:
  schemas:
    ChatRequest:
      type: object
      required: [conversation_id, installation_id, messages]
      properties:
        conversation_id: { type: string, format: uuid }
        installation_id: { type: string, maxLength: 128 }
        locale: { type: string, default: ca-ES }
        ruleset: { type: string, const: concurs-2026 }
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/ChatMessage' }
        share_for_improvement:
          type: boolean
          default: false
          description: Permet desar la consulta per millorar la calculadora. Els clients antics no l'envien i no se'n desa res.
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 2000 }
    ChatResponse:
      type: object
      required: [reply, intent, performances, winner_label, warnings, ruleset_version, needs_clarification, presentation]
      properties:
        reply: { type: string }
        intent: { type: string, enum: [lookup, comparison, total, contest_info, clarification, unsupported] }
        performances:
          description: Buit quan intent és contest_info.
          type: array
          items: { $ref: '#/components/schemas/Performance' }
        winner_label: { type: [string, 'null'] }
        warnings:
          type: array
          items: { type: string }
        ruleset_version: { type: string, example: concurs-2026 }
        needs_clarification: { type: boolean }
        presentation:
          description: Presentació tipada opcional per a respostes del rànquing; `reply` continua sent el fallback textual.
          oneOf:
            - $ref: '#/components/schemas/ScorePresentation'
            - type: 'null'
    ScorePresentation:
      type: object
      required: [type, title, outcome, focus_notation, rows]
      properties:
        type: { type: string, const: score_ranking }
        title: { type: string }
        outcome: { type: string, enum: [loaded, unloaded, both] }
        focus_notation: { type: [string, 'null'] }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ScoreRankingRow' }
    ScoreRankingRow:
      type: object
      required: [position, notation, loaded_points, unloaded_points]
      properties:
        position: { type: integer, minimum: 1 }
        notation: { type: string }
        loaded_points: { type: integer }
        unloaded_points: { type: integer }
    Performance:
      type: object
      required: [label, total, castells]
      properties:
        label: { type: string }
        total: { type: integer }
        castells:
          type: array
          items: { $ref: '#/components/schemas/ScoredCastell' }
    ScoredCastell:
      type: object
      required: [input, outcome, points, counted]
      properties:
        input: { type: string }
        canonical: { type: [string, 'null'] }
        outcome: { type: string, enum: [loaded, unloaded, attempt] }
        points: { type: integer }
        counted: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [null, unknown_castell, attempt, duplicate_structure, loaded_limit, outside_top_three]
