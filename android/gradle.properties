org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Backend used by the app. Release builds use castells.apiBaseUrl (production).
# Debug builds use castells.apiBaseUrl.debug: the local backend on this computer, as the
# emulator reaches it. Change it per machine in ~/.gradle/gradle.properties, with
# -Pcastells.apiBaseUrl.debug=... or with the CASTELLS_API_BASE_URL environment variable.
castells.apiBaseUrl=https://castells-superapp-poc.vercel.app
castells.apiBaseUrl.debug=http://10.0.2.2:8000
