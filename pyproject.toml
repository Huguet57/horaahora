[project]
name = "horaahora"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "PyJWT[crypto]>=2.8",
  "httpx[http2]>=0.27",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
